<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join Tidebreak</title>
<style>
  :root{--ink:#f1ede4;--dim:#a49d90;--amber:#ffb547;--faint:rgba(255,255,255,.16);--bg:#0b0d10}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(120% 90% at 80% 10%,#4a2a14 0%,#14100c 55%,var(--bg) 100%);color:var(--ink);font:15px/1.5 ui-monospace,Menlo,monospace;padding:16px}
  .card{width:min(560px,100%);display:grid;gap:18px}
  h1{font:800 64px/.9 -apple-system,Helvetica,Arial,sans-serif;margin:0;letter-spacing:-.01em;text-transform:uppercase}
  h1 em{font-style:normal;color:var(--amber)}
  p{margin:0;color:var(--dim)}
  label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  input{flex:1 1 260px;background:rgba(255,255,255,.06);border:1px solid var(--faint);color:var(--ink);font:500 20px/1 ui-monospace,Menlo,monospace;padding:14px;border-radius:2px;text-transform:lowercase}
  input:focus{outline:2px solid var(--amber);outline-offset:1px}
  button{background:var(--amber);color:#16110a;border:0;border-radius:2px;padding:14px 28px;font:800 20px/1 -apple-system,Helvetica,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  button:disabled{opacity:.5;cursor:wait}
  #msg{min-height:1.5em}
  #msg.err{color:#ff8a7a}
  a{color:var(--amber)}
</style>
</head>
<body>
<div class="card">
  <h1>Tide<em>break</em></h1>
  <p>Join a match over the internet. Ask the host for the join code on their screen.</p>
  <label for="code">Join code</label>
  <div class="row">
    <input id="code" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="sunny-lake-river-boat" autofocus>
    <button id="go" type="button">Join</button>
  </div>
  <p id="msg"></p>
</div>
<script>
  var inp = document.getElementById('code'), btn = document.getElementById('go'), msg = document.getElementById('msg');
  function norm(v) {
    return String(v || '').trim().toLowerCase().replace(/^[a-z]+:\/\//, '').replace(/\.trycloudflare\.com.*$/, '').replace(/\/.*$/, '')
      .replace(/[\s_.]+/g, '-').replace(/[^a-z0-9-]/g, '').replace(/-+/g, '-').replace(/^-|-$/g, '');
  }
  function go() {
    var code = norm(inp.value);
    if (!/^[a-z0-9]+(-[a-z0-9]+)+$/.test(code)) { msg.className = 'err'; msg.textContent = 'A join code is a few words joined by dashes, like sunny-lake-river-boat.'; return; }
    var url = 'https://' + code + '.trycloudflare.com/';
    btn.disabled = true; msg.className = ''; msg.textContent = 'Looking for the match…';
    var img = new Image(), done = false;
    var fail = function () {
      if (done) return; done = true; btn.disabled = false; msg.className = 'err';
      msg.innerHTML = 'No match found for <b></b>. Check the spelling with the host, and make sure their Tidebreak window is still open. <a>Try opening it anyway</a>';
      msg.querySelector('b').textContent = code; msg.querySelector('a').href = url;
    };
    var t = setTimeout(fail, 12000);
    img.onload = function () { if (done) return; done = true; clearTimeout(t); msg.textContent = 'Found it. Loading the game…'; location.href = url; };
    img.onerror = function () { clearTimeout(t); fail(); };
    img.src = url + 'probe.gif?' + Date.now();
  }
  btn.onclick = go;
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
</script>
</body>
</html>
